name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuanLyChiTieu.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R "$RUNNER_TEMP/QuanLyChiTieu.xcarchive/Products/Applications/App.app" dist/Payload/QuanLyChiTieu.app
          cd dist
          zip -qry QuanLyChiTieu-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyChiTieu-unsigned-IPA
          path: dist/QuanLyChiTieu-unsigned.ipa
          if-no-files-found: error
